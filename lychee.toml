# lychee link checker — https://github.com/lycheeverse/lychee
max_retries = 2
retry_wait_time = 2
max_concurrency = 8
timeout = 30  # seconds; some official pages are heavy/slow

# 2xx + rate-limited treated as alive.
accept = [200, 202, 204, 206, 429]

# Add verified-but-bot-blocked or heavy URLs here as needed.
exclude = [
  "/security/advisories/new$",
  "^https://img\\.shields\\.io",
  # the handbook's own published site (live only after the first deploy)
  "^https://ruanpato\\.com/production-ai-engineering/",
  # self-references to this repo on GitHub (resolve once the repo is public)
  "^https://github\\.com/ruanpato/production-ai-engineering",
  # LinkedIn returns HTTP 999 to bots (verified manually)
  "^https://www\\.linkedin\\.com",
  # NTIA serves a chain some clients distrust; the page is valid
  "^https://www\\.ntia\\.gov",
  # Milvus docs return a 302 redirect loop to bots; valid in a browser
  "^https://milvus\\.io",
  "^https://ruanpato\\.com/?$",
]

# BOOK.md is a transitional monolithic artifact (superseded by content/); not link-checked.
exclude_path = [".internal", "node_modules", "site", "templates", "BOOK.md"]
